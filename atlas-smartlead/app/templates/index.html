<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Lojistik Asistanı</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #081830;
        }

        header {
            background: #081830;
            color: white;
            padding: 24px;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 24px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px #08183012;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 120px;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccd5e3;
            border-radius: 8px;
            font: inherit;
        }

        button {
            background: #123b70;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #answer {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-top: 20px;
        }

        nav a {
            color: white;
            margin-right: 18px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ATLAS</h1>
        <p>Akıllı lojistik planlama asistanı</p>
        <nav><a href="/">Ana Sayfa</a><a href="/dashboard">Kayıt Paneli</a></nav>
    </header>

    <main>
        <section class="panel">
            <h2>Lojistik planlamanı kolaylaştır</h2>
            <p>Taşıma planın veya operasyonun hakkında sorunu yaz.</p>

            <form id="chat-form">
                <textarea id="message" placeholder="Örn. İstanbul'dan Belgrad'a taşıma planlamak istiyorum." required></textarea>
                <button type="submit">Atlas'a Sor</button>
            </form>

            <div id="answer" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const messageInput = document.getElementById("message");
        const answer = document.getElementById("answer");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const mesaj = messageInput.value.trim();
            if (!mesaj) return;

            answer.textContent = "Atlas yanıt hazırlıyor...";

            try {
                const response = await fetch("/api/sohbet", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({mesaj})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Bir hata oluştu.");
                }

                answer.textContent = data.yanit;
            } catch (error) {
                answer.textContent = "İstek başarısız oldu: " + error.message;
            }
        });
    </script>
</body>
</html>
